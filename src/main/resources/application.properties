spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shop_db}

# MongoDB connection pool configuration for better performance
spring.data.mongodb.max-connections-per-host=100
spring.data.mongodb.min-connections-per-host=10
spring.data.mongodb.max-connection-idle-time=60000
spring.data.mongodb.max-connection-life-time=120000
spring.data.mongodb.connection-timeout=5000

server.port=${PORT:10000}
server.forward-headers-strategy=framework

server.error.include-message=always
server.error.include-stacktrace=always

# Session cookie configuration for Render/HTTPS
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
