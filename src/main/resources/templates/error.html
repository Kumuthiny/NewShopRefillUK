<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="text-center p-4">
    <h3 class="text-danger">Something went wrong</h3>
    <p class="text-muted" th:text="${message}">An unexpected error occurred.</p>
    <p class="text-muted small" th:text="${status}"></p>
    <a href="/" class="btn btn-primary mt-2">Go to Dashboard</a>
    <a href="/login" class="btn btn-outline-secondary mt-2 ms-2">Login</a>
</div>
</body>
</html>
