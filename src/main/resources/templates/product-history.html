<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .action-ADDED        { border-left: 4px solid #198754; }
        .action-NEED_REFILL  { border-left: 4px solid #dc3545; }
        .action-AMOUNT_UPDATED { border-left: 4px solid #fd7e14; }
        .action-REFILLED     { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a th:href="@{'/shop/' + ${product.shopId}}" class="navbar-brand">
            <i class="bi bi-arrow-left me-2"></i> Back to <span th:text="${product.shopName}"></span>
        </a>
    </div>
</nav>

<div class="container pb-5" style="max-width:700px;">

    <!-- PRODUCT HEADER -->
    <div class="card border-0 shadow-sm rounded-4 mb-4 p-4">
        <div class="fw-bold fs-5">
            <span th:text="${product.name}"></span>
            <span th:if="${product.category != null}"
                  class="badge bg-secondary ms-2"
                  th:text="${product.category}"></span>
        </div>
        <div class="text-muted small mt-1">
            Shop: <strong th:text="${product.shopName}"></strong>
            &nbsp;·&nbsp;
            Added by <strong th:text="${product.addedBy}"></strong>
            on <span th:text="${#temporals.format(product.addedTime, 'dd/MM/yy HH:mm')}"></span>
        </div>
    </div>

    <!-- TIMELINE -->
    <h6 class="fw-bold mb-3 text-muted">
        <i class="bi bi-clock-history me-2"></i>Update History
    </h6>

    <div th:if="${logs.empty}" class="text-center text-muted py-4">
        No history yet.
    </div>

    <div th:each="log : ${logs}"
         th:classappend="'action-' + ${log.action}"
         class="card border-0 shadow-sm rounded-3 mb-3 px-4 py-3">

        <div class="d-flex justify-content-between align-items-start">

            <!-- ACTION BADGE + INFO -->
            <div>
                <span th:switch="${log.action}">
                    <span th:case="'ADDED'"
                          class="badge bg-success me-2">Added</span>
                    <span th:case="'NEED_REFILL'"
                          class="badge bg-danger me-2">Flagged for Refill</span>
                    <span th:case="'AMOUNT_UPDATED'"
                          class="badge bg-warning text-dark me-2">Amount Updated</span>
                    <span th:case="'REFILLED'"
                          class="badge bg-primary me-2">Refilled</span>
                </span>

                <span class="fw-semibold" th:text="${log.performedBy}"></span>

                <span th:if="${log.refillAmount != null}"
                      class="text-muted ms-2 small">
                    · qty <strong th:text="${log.refillAmount}"></strong>
                </span>
            </div>

            <!-- DATE/TIME -->
            <div class="text-muted small">
                <span th:text="${#temporals.format(log.performedAt, 'dd/MM/yy HH:mm')}"></span>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
