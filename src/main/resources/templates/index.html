<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .stat-card { border-radius: 12px; color: white; padding: 24px; text-align: center; }
        .editor-info { font-size: 12px; color: #0d6efd; }
        .shop-section-header { background: #f0f4ff; border-left: 4px solid #0d6efd; padding: 10px 16px; font-weight: 600; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="bi bi-shop me-2"></i>Owner Dashboard</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </form>
    </div>
</nav>

<div class="container pb-5">

    <!-- STATS -->
    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="stat-card bg-primary shadow-sm">
                <div class="fs-2 fw-bold" th:text="${totalShops}">0</div>
                <div class="small">Total Shops</div>
            </div>
        </div>
        <div class="col-4">
            <div class="stat-card bg-warning text-dark shadow-sm">
                <div class="fs-2 fw-bold" th:text="${shopCount}">0</div>
                <div class="small">Shops Need Refill</div>
            </div>
        </div>
        <div class="col-4">
            <div class="stat-card bg-danger shadow-sm">
                <div class="fs-2 fw-bold" th:text="${totalQuantity}">0</div>
                <div class="small">Products to Refill</div>
            </div>
        </div>
    </div>

    <!-- SHOPS -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-header bg-white border-0 pt-3 pb-0 px-4">
            <h6 class="fw-bold"><i class="bi bi-shop me-2 text-primary"></i>Shops</h6>
        </div>
        <div class="card-body px-4 pb-4">
            <div class="row g-3">
                <div th:each="s : ${shops}" class="col-md-4">
                    <a th:href="@{'/shop/' + ${s.id}}" class="text-decoration-none">
                        <div class="card border-0 shadow-sm rounded-3 p-3 h-100"
                             th:classappend="${shopRefillMap[s.id] != null} ? 'border-warning border' : ''">
                            <div class="fw-bold fs-6" th:text="${s.name}"></div>
                            <div class="mt-2">
                                <span th:if="${shopRefillMap[s.id] != null}"
                                      class="badge bg-danger rounded-pill">
                                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                                    <span th:text="${shopRefillMap[s.id]}"></span> products
                                </span>
                                <span th:if="${shopRefillMap[s.id] == null}"
                                      class="badge bg-success rounded-pill">
                                    <i class="bi bi-check-circle-fill me-1"></i> All Good
                                </span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <div class="mt-4 pt-3 border-top">
                <form action="/shops/add" method="post" class="d-flex gap-2">
                    <input type="text" name="name" class="form-control" style="max-width:250px;"
                           placeholder="New shop name" required>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-plus-lg me-1"></i>Add Shop
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- PENDING REFILLS — one table per shop -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-0 pt-3 pb-2 px-4">
            <h6 class="fw-bold text-danger mb-0">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Pending Refills
            </h6>
        </div>

        <!-- ALL CLEAR -->
        <div th:if="${refillProducts.empty}" class="text-center text-muted py-5">
            <i class="bi bi-check-circle-fill text-success fs-2 d-block mb-2"></i>
            All shops are fully stocked.
        </div>

        <!-- ONE SECTION PER SHOP -->
        <div th:if="${!refillProducts.empty}">
            <div th:each="s : ${shops}">
                <!-- only render if this shop has refill items -->
                <div th:if="${refillByShop[s.id] != null}">

                    <div class="shop-section-header d-flex justify-content-between align-items-center">
                        <span>
                            <i class="bi bi-shop me-2 text-primary"></i>
                            <a th:href="@{'/shop/' + ${s.id}}"
                               th:text="${s.name}"
                               class="text-decoration-none text-dark fw-bold"></a>
                        </span>
                        <span class="badge bg-danger rounded-pill">
                            <span th:text="${shopRefillMap[s.id]}"></span> items
                        </span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Product</th>
                                    <th>Category</th>
                                    <th>Qty</th>
                                    <th>Flagged By</th>
                                    <th>Date &amp; Time</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${refillByShop[s.id]}">
                                    <td class="ps-4">
                                        <div class="d-flex align-items-center gap-2">
                                            <div style="width:40px;height:40px;border-radius:6px;background:#e9ecef;display:flex;align-items:center;justify-content:center;color:#adb5bd;">
                                                <i class="bi bi-box"></i>
                                            </div>
                                            <span class="fw-semibold" th:text="${p.name}"></span>
                                        </div>
                                    </td>
                                    <td>
                                        <span th:if="${p.category != null}"
                                              class="badge bg-secondary"
                                              th:text="${p.category}"></span>
                                        <span th:if="${p.category == null}" class="text-muted">—</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-danger rounded-pill fw-bold"
                                              th:text="${p.refillAmount != null ? p.refillAmount : 1}"></span>
                                    </td>
                                    <td class="editor-info">
                                        <span th:if="${p.updatedBy != null}" th:text="${p.updatedBy}"></span>
                                        <span th:if="${p.updatedBy == null}" class="text-muted">—</span>
                                    </td>
                                    <td class="text-muted small">
                                        <span th:if="${p.updatedTime != null}"
                                              th:text="${p.updatedTime.toString().substring(0,16).replace('T',' ')}"></span>
                                        <span th:if="${p.updatedTime == null}">—</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
