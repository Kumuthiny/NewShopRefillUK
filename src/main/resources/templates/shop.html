<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${shop.name}">Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .product-row { transition: background 0.2s; }
        .need-refill-row { background: #fff8f0; border-left: 4px solid #fd7e14 !important; }
        .badge-cat { font-size: 11px; }
        .meta-text { font-size: 12px; color: #888; }
        .editor-info { font-size: 12px; color: #0d6efd; font-weight: 500; }
    </style>
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-arrow-left me-2"></i> Dashboard
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="navbar-text text-white fw-bold" th:text="${shop.name}">Shop</span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-light btn-sm rounded-pill">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- ADD PRODUCT FORM -->
    <div class="card border-0 shadow-sm mb-4 rounded-4">
        <div class="card-body p-4">
            <h6 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2 text-success"></i>Add New Item</h6>

            <form th:action="@{/products/add}" method="post" class="row g-2 align-items-end">
                <input type="hidden" name="shopId" th:value="${shop.id}">

                <div class="col-md-3">
                    <label class="form-label small text-muted">Item Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Rice" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label small text-muted">Category (optional)</label>
                    <input type="text" name="category" class="form-control" placeholder="e.g. Groceries">
                </div>

                <div class="col-md-3">
                    <label class="form-label small text-muted">Your Name</label>
                    <input type="text" name="addedBy" class="form-control" placeholder="Worker name" required>
                </div>

                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-plus-lg me-1"></i> Add Item
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- PRODUCT LIST -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white border-0 pt-3 pb-2 px-4">
            <h6 class="fw-bold mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Product List</h6>
        </div>

        <div th:if="${products.empty}" class="text-center text-muted py-5">
            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
            No items yet. Add your first product above.
        </div>

        <div th:each="p : ${products}"
             th:classappend="${p.status == 'NEED_REFILL'} ? 'need-refill-row' : ''"
             class="product-row border-bottom px-4 py-3">

            <div class="row align-items-center g-2">

                <!-- PRODUCT INFO -->
                <div class="col-md-4">
                    <div class="fw-semibold">
                        <span th:text="${p.name}"></span>
                        <span th:if="${p.category != null}"
                              class="badge bg-secondary badge-cat ms-1"
                              th:text="${p.category}"></span>
                    </div>
                    <div class="meta-text mt-1">
                        Added by <strong th:text="${p.addedBy}"></strong>
                        &nbsp;·&nbsp;
                        <span th:text="${#temporals.format(p.addedTime, 'dd/MM/yy HH:mm')}"></span>
                    </div>
                    <!-- show last editor info if exists -->
                    <div th:if="${p.updatedBy != null}" class="editor-info mt-1">
                        <i class="bi bi-pencil-fill me-1"></i>
                        <span th:text="${p.updatedBy}"></span>
                        &nbsp;·&nbsp;
                        <span th:text="${#temporals.format(p.updatedTime, 'dd/MM/yy HH:mm')}"></span>
                    </div>
                </div>

                <!-- REFILL STATUS BADGE -->
                <div class="col-md-2 text-center">
                    <span th:if="${p.status == 'NEED_REFILL'}"
                          class="badge bg-danger rounded-pill px-3 py-2">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        Needs Refill
                        &nbsp;·&nbsp;
                        Qty: <strong th:text="${p.refillAmount != null ? p.refillAmount : 1}"></strong>
                    </span>
                    <span th:if="${p.status == 'NORMAL'}"
                          class="badge bg-success rounded-pill px-3 py-2">
                        <i class="bi bi-check-circle-fill me-1"></i> OK
                    </span>
                </div>

                <!-- ACTIONS -->
                <div class="col-md-6">
                    <div class="d-flex flex-wrap gap-2 justify-content-md-end">

                        <!-- MARK NEED REFILL (with amount + name) — shown when NORMAL -->
                        <form th:if="${p.status == 'NORMAL'}"
                              th:action="@{'/products/' + ${p.id} + '/need'}"
                              method="post"
                              class="d-flex gap-1 align-items-center">
                            <input type="number" name="amount" class="form-control form-control-sm"
                                   style="width:70px;" placeholder="Qty" min="1" required>
                            <input type="text" name="updatedBy" class="form-control form-control-sm"
                                   style="width:110px;" placeholder="Your name" required>
                            <button type="submit" class="btn btn-warning btn-sm text-dark">
                                <i class="bi bi-flag-fill me-1"></i>Need Refill
                            </button>
                        </form>

                        <!-- EDIT REFILL AMOUNT — shown when NEED_REFILL -->
                        <form th:if="${p.status == 'NEED_REFILL'}"
                              th:action="@{'/products/' + ${p.id} + '/edit-amount'}"
                              method="post"
                              class="d-flex gap-1 align-items-center">
                            <input type="number" name="amount" class="form-control form-control-sm"
                                   style="width:70px;"
                                   th:value="${p.refillAmount}"
                                   min="1" required>
                            <input type="text" name="updatedBy" class="form-control form-control-sm"
                                   style="width:110px;" placeholder="Your name" required>
                            <button type="submit" class="btn btn-outline-warning btn-sm">
                                <i class="bi bi-pencil me-1"></i>Update Qty
                            </button>
                        </form>

                        <!-- MARK REFILLED (done) — shown when NEED_REFILL -->
                        <form th:if="${p.status == 'NEED_REFILL'}"
                              th:action="@{'/products/' + ${p.id} + '/done'}"
                              method="post"
                              class="d-flex gap-1 align-items-center">
                            <input type="text" name="updatedBy" class="form-control form-control-sm"
                                   style="width:110px;" placeholder="Your name" required>
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="bi bi-check2-circle me-1"></i>Refilled
                            </button>
                        </form>

                        <!-- HISTORY -->
                        <a th:href="@{'/products/' + ${p.id} + '/history'}"
                           class="btn btn-outline-secondary btn-sm"
                           title="View history">
                            <i class="bi bi-clock-history"></i>
                        </a>

                        <!-- DELETE -->
                        <form th:action="@{'/products/' + ${p.id} + '/delete'}"
                              method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Delete this item?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
