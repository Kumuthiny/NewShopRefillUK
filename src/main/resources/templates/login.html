<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="login-card bg-white">

    <div class="text-center mb-4">
        <i class="bi bi-shop fs-1 text-primary"></i>
        <h5 class="fw-bold mt-2 mb-0">Shop Refill Manager</h5>
        <p class="text-muted small">Sign in to continue</p>
    </div>

    <!-- error -->
    <div th:if="${param.error}"
         class="alert alert-danger py-2 small text-center rounded-3">
        Invalid username or password.
    </div>

    <!-- logout -->
    <div th:if="${param.logout}"
         class="alert alert-success py-2 small text-center rounded-3">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label small text-muted">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control"
                       placeholder="Enter username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small text-muted">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control"
                       placeholder="Enter password" required>
                <button type="button" class="btn btn-outline-secondary"
                        id="toggleBtn" onclick="togglePassword()"
                        style="border-left:0; border-radius:0 8px 8px 0;">
                    <i class="bi bi-eye-fill" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>

    </form>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
    }
</script>
</body>
</html>
